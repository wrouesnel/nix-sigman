# Example resigning rules in the ResigningNode format (see pkg/resigning/signing_ast.go).
#
# Key names refer to loaded public keys (signed_by) and private keys (sign_with).
# Each node has exactly one operand, except if/then blocks.
statements:
  # Resign anything signed by all of these upstream keys.
  - if:
      and:
        - signed_by: key1
        - signed_by: key2
        - signed_by: key3
    then:
      statements:
        - sign_with: local-key-1
        - sign_with: local-key-2
  # Resign anything signed by either key4 or key5, unless key6 has signed it too.
  - if:
      and:
        - or:
            - signed_by: key4
            - signed_by: key5
        - not:
            signed_by: key6
    then:
      sign_with: local-key-1
  # Sign packages which have never been signed at all.
  - if:
      not:
        signed: {}
    then:
      sign_with: unsigned-key-1
